<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UWED Free Rooms</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5fa; --surface: #ffffff; --surface-2: #eef0f6; --text: #0e1220; --muted: #6b7185;
    --line: rgba(14, 18, 32, .07); --accent: #5b5bf6; --accent-2: #8b5cf6; --on-accent: #fff;
    --good: #10b981; --good-bg: rgba(16, 185, 129, .12); --warn: #f59e0b; --warn-bg: rgba(245, 158, 11, .14);
    --bad: #ef4444; --bad-bg: rgba(239, 68, 68, .12);
    --shadow: 0 1px 2px rgba(14, 18, 32, .04), 0 8px 24px -12px rgba(14, 18, 32, .18);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0b0d14; --surface: #151824; --surface-2: #1d2130; --text: #eef0f8; --muted: #8b91a7;
    --line: rgba(255, 255, 255, .07); --accent: #7c7cff; --accent-2: #a78bfa;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -14px rgba(0, 0, 0, .7);
  } }
  :root[data-theme="dark"] {
    --bg: #0b0d14; --surface: #151824; --surface-2: #1d2130; --text: #eef0f8; --muted: #8b91a7;
    --line: rgba(255, 255, 255, .07); --accent: #7c7cff; --accent-2: #a78bfa;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -14px rgba(0, 0, 0, .7);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  main { max-width: 680px; margin: 0 auto; padding: 14px 16px calc(28px + env(safe-area-inset-bottom)); }

  /* hero */
  .hero { position: relative; overflow: hidden; border-radius: 24px; padding: 18px 18px 16px; color: var(--on-accent);
    background: radial-gradient(120% 140% at 100% 0%, var(--accent-2) 0%, transparent 55%),
                linear-gradient(135deg, var(--accent) 0%, #4338ca 100%);
    box-shadow: 0 18px 40px -20px var(--accent); }
  .hero::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 180px; height: 180px; border-radius: 50%;
    background: rgba(255, 255, 255, .08); }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; opacity: .9; }
  .live { display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, .16); padding: 4px 10px;
    border-radius: 999px; font-weight: 600; font-size: 12px; backdrop-filter: blur(6px); }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 0 rgba(74, 222, 128, .7);
    animation: pulse 1.8s infinite; }
  .live.off i { background: #fbbf24; animation: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(74, 222, 128, 0); } 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); } }
  .big { display: flex; align-items: baseline; gap: 8px; margin: 10px 0 2px; position: relative; z-index: 1; }
  .big b { font-size: 46px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .big span { font-size: 15px; opacity: .85; }
  .slotline { font-size: 14px; opacity: .92; position: relative; z-index: 1; }
  .bar { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .2); margin-top: 12px; overflow: hidden; position: relative; z-index: 1; }
  .bar > div { height: 100%; border-radius: 99px; background: #fff; transition: width .5s ease; }

  /* sections */
  .sec { margin-top: 18px; }
  .sec-h { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 2px 8px; }
  .scroll { position: relative; display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; margin: 0 -2px;
    scrollbar-width: none; scroll-snap-type: x proximity; }
  .scroll::-webkit-scrollbar { display: none; }

  .day { flex: none; min-width: 56px; padding: 9px 10px 10px; border: 0; border-radius: 16px; background: var(--surface);
    box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
    scroll-snap-align: start; transition: transform .15s ease, background .2s; }
  .day small { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  .day b { font-size: 19px; font-weight: 700; }
  .day.on { background: var(--text); color: var(--bg); }
  .day.on small { color: inherit; opacity: .7; }
  .day:active, .slot:active, .seg button:active, .tag:active { transform: scale(.96); }

  .slot { flex: none; border: 0; border-radius: 14px; padding: 9px 14px; background: var(--surface); box-shadow: var(--shadow);
    cursor: pointer; text-align: left; scroll-snap-align: start; transition: transform .15s ease, background .2s; }
  .slot b { display: block; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
  .slot small { font-size: 11px; color: var(--muted); }
  .slot.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); }
  .slot.on small { color: inherit; opacity: .85; }
  .slot.past { opacity: .4; }

  .seg { display: flex; background: var(--surface-2); padding: 4px; border-radius: 14px; gap: 2px; }
  .seg button { flex: 1 1 auto; border: 0; background: transparent; padding: 8px 10px; border-radius: 10px; font-weight: 600; font-size: 14px;
    color: var(--muted); cursor: pointer; transition: all .2s; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  .tools { display: flex; gap: 8px; margin-top: 10px; }
  .search { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 14px; padding: 0 12px;
    box-shadow: var(--shadow); }
  .search svg { flex: none; color: var(--muted); }
  .search input { flex: 1; border: 0; outline: 0; background: transparent; padding: 11px 0; min-width: 0; }
  .search input::placeholder { color: var(--muted); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .tag { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px;
    font-weight: 500; cursor: pointer; transition: all .2s; }
  .tag.on { border-color: transparent; background: var(--text); color: var(--bg); }

  /* rooms */
  .group { margin-top: 20px; }
  .group-h { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; margin: 0 2px 10px; }
  .group-h .dot { width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; font-size: 13px;
    color: #fff; font-weight: 800; }
  .group-h small { color: var(--muted); font-weight: 500; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .room { background: var(--surface); border-radius: var(--radius); padding: 13px 13px 12px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .room-name { font-size: 17px; font-weight: 700; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .room-meta { display: flex; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .room-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .badge { align-self: flex-start; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; }
  .badge.good { color: var(--good); background: var(--good-bg); }
  .badge.warn { color: var(--warn); background: var(--warn-bg); }
  .badge.bad { color: var(--bad); background: var(--bad-bg); }

  .empty { text-align: center; color: var(--muted); padding: 44px 16px; }
  .empty div { font-size: 40px; margin-bottom: 8px; }
  .skel { height: 92px; border-radius: var(--radius); background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
    background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="hero-top"><span id="title"></span><span class="live" id="live"><i></i><span id="live-t"></span></span></div>
    <div class="big"><b id="count">–</b><span id="count-of"></span></div>
    <div class="slotline" id="slotline">&nbsp;</div>
    <div class="bar"><div id="bar" style="width:0"></div></div>
  </section>

  <div class="sec"><div class="sec-h" id="l-day"></div><div class="scroll" id="days"></div></div>
  <div class="sec"><div class="sec-h" id="l-time"></div><div class="scroll" id="slots"></div></div>
  <div class="sec">
    <div class="seg" id="buildings"></div>
    <div class="tools">
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" inputmode="search" autocomplete="off">
      </label>
    </div>
    <div class="tags" id="types"></div>
  </div>

  <div id="list"><div class="grid" style="margin-top:20px"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
  <footer id="foot"></footer>
</main>
<script>
const TG = window.Telegram && Telegram.WebApp;
const inTG = !!(TG && TG.initData);
if (inTG) {
  TG.ready(); TG.expand();
  document.documentElement.dataset.theme = TG.colorScheme === "dark" ? "dark" : "light";
  const paint = () => { const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    try { TG.setHeaderColor(bg); TG.setBackgroundColor(bg); } catch (e) {} };
  paint();
  TG.onEvent("themeChanged", () => { document.documentElement.dataset.theme = TG.colorScheme === "dark" ? "dark" : "light"; paint(); });
}

const I18N = {
  en: { title: "UWED · Free rooms", day: "Day", time: "Time", all: "All", other: "Other", search: "Search room, e.g. 305",
        today: "Today", tomorrow: "Tmrw", now: "Now", live: "Live", later: "Planned", ends: m => `ends in ${m}`, starts: m => `starts in ${m}`,
        freeOf: t => `of ${t} rooms free`, rest: "All day", forT: t => `until ${t}`, seats: n => `${n}`,
        h: "h", m: "min", saved: t => `Bookings saved ${t}. Later changes aren't shown.`,
        nolessons: "No lessons anywhere this day — every room is free.", none: "No free rooms match.",
        nodata: "No room data for this week yet. It updates when the bot's computer is on university Wi-Fi.",
        failed: "Couldn't load room data. Check your connection and try again.",
        days: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
        types: { LECTURE: "Lecture", PRACTICE: "Practice", LANGUAGE_LAB: "Language lab", COMPUTER: "Computer", SEMINAR: "Seminar" } },
  ru: { title: "UWED · Свободные аудитории", day: "День", time: "Время", all: "Все", other: "Другие", search: "Поиск, напр. 305",
        today: "Сегодня", tomorrow: "Завтра", now: "Сейчас", live: "Сейчас", later: "План", ends: m => `до конца ${m}`, starts: m => `начало через ${m}`,
        freeOf: t => `из ${t} свободно`, rest: "Весь день", forT: t => `до ${t}`, seats: n => `${n}`,
        h: "ч", m: "мин", saved: t => `Бронирования сохранены ${t}. Более поздние изменения не видны.`,
        nolessons: "В этот день занятий нет — все аудитории свободны.", none: "Нет подходящих свободных аудиторий.",
        nodata: "Данных на эту неделю пока нет. Они обновятся, когда компьютер бота будет в Wi-Fi университета.",
        failed: "Не удалось загрузить данные. Проверьте подключение и попробуйте снова.",
        days: ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"],
        types: { LECTURE: "Лекционная", PRACTICE: "Практика", LANGUAGE_LAB: "Лингафонная", COMPUTER: "Компьютерная", SEMINAR: "Семинар" } },
  uz: { title: "UWED · Boʻsh xonalar", day: "Kun", time: "Vaqt", all: "Hammasi", other: "Boshqa", search: "Qidirish, m-n 305",
        today: "Bugun", tomorrow: "Ertaga", now: "Hozir", live: "Hozir", later: "Reja", ends: m => `${m} qoldi`, starts: m => `${m} dan keyin`,
        freeOf: t => `/ ${t} ta xona boʻsh`, rest: "Kun boʻyi", forT: t => `${t} gacha`, seats: n => `${n}`,
        h: "soat", m: "daq", saved: t => `Bandlik ${t} da saqlangan. Keyingi oʻzgarishlar koʻrinmaydi.`,
        nolessons: "Bu kunda hech qanday dars yoʻq — hamma xonalar boʻsh.", none: "Mos boʻsh xona yoʻq.",
        nodata: "Bu hafta uchun maʼlumot hali yoʻq. Bot kompyuteri universitet Wi-Fi tarmogʻida boʻlganda yangilanadi.",
        failed: "Maʼlumotni yuklab boʻlmadi. Internetni tekshirib, qayta urinib koʻring.",
        days: ["Yak","Du","Se","Ch","Pa","Ju","Sha"],
        types: { LECTURE: "Maʼruza", PRACTICE: "Amaliyot", LANGUAGE_LAB: "Til lab.", COMPUTER: "Kompyuter", SEMINAR: "Seminar" } },
};
const qs = new URLSearchParams(location.search);
const tgLang = TG && TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.language_code;
const L = I18N[qs.get("lang")] ? qs.get("lang") : I18N[tgLang] ? tgLang : "en";
const T = I18N[L];
document.documentElement.lang = L;

const BCOL = { A: "#6366f1", B: "#ec4899", C: "#14b8a6", D: "#f59e0b", F: "#10b981" };

function tashkentNow() {  // "now" in Tashkent, whatever the phone's time zone
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tashkent", hourCycle: "h23",
    year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, mins: +p.hour * 60 + +p.minute };
}
const mins = t => { const [h, m] = t.split(":"); return +h * 60 + +m; };
const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const dur = m => m >= 60 ? `${Math.floor(m / 60)} ${T.h}${m % 60 ? ` ${m % 60} ${T.m}` : ""}` : `${m} ${T.m}`;
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const weekday = iso => new Date(iso + "T12:00:00Z").getUTCDay();
const building = n => /^[A-Z]-/i.test(n) ? n[0].toUpperCase() : T.other;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = id => document.getElementById(id);
const tap = () => { if (TG && TG.HapticFeedback) TG.HapticFeedback.selectionChanged(); };

let DATA = null;
const state = { day: null, slot: null, b: "", t: "", q: "" };

function slotsFor(day) {
  const longest = {};
  for (const r of DATA.rooms) for (const s of r.b[day] || []) {
    const [a, e] = s.split("-");
    if (!longest[a] || mins(e) > mins(longest[a])) longest[a] = e;
  }
  return Object.entries(longest).sort((x, y) => mins(x[0]) - mins(y[0]));
}

function el(tag, cls, html, onclick) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  n.innerHTML = html;
  if (onclick) n.onclick = () => { onclick(); tap(); render(); };
  return n;
}
function center(row) { const on = $(row).querySelector(".on"); if (on) $(row).scrollTo({ left: on.offsetLeft - 16, behavior: "instant" }); }

function render(keepScroll) {
  const now = tashkentNow();
  const days = [];
  for (let d = now.date < DATA.from ? DATA.from : now.date; d <= DATA.until; d = addDays(d, 1))
    if (DATA.rooms.some(r => r.b[d])) days.push(d);
  if (!days.length) { $("list").innerHTML = `<div class="empty"><div>🗓️</div>${T.nodata}</div>`; return; }
  if (!days.includes(state.day)) state.day = days[0];
  $("days").replaceChildren(...days.map(d => {
    const top = d === now.date ? T.today : d === addDays(now.date, 1) ? T.tomorrow : T.days[weekday(d)];
    return el("button", "day" + (d === state.day ? " on" : ""), `<small>${top}</small><b>${+d.slice(8)}</b>`,
      () => { state.day = d; state.slot = null; });
  }));

  const isToday = state.day === now.date;
  const slots = slotsFor(state.day);
  const upcoming = slots.filter(([a, e]) => !isToday || mins(e) > now.mins);
  if (!state.slot || !slots.some(([a]) => a === state.slot)) state.slot = (upcoming[0] || slots[0] || [null])[0];
  $("slots").replaceChildren(...slots.map(([a, e]) => {
    const past = isToday && mins(e) <= now.mins, cur = isToday && mins(a) <= now.mins && now.mins < mins(e);
    return el("button", "slot" + (a === state.slot ? " on" : "") + (past ? " past" : ""),
      `<b>${a}</b><small>${cur ? "● " + T.now : "→ " + e}</small>`, () => { state.slot = a; });
  }));

  const blds = [...new Set(DATA.rooms.map(r => building(r.n)))].sort((x, y) => (x === T.other) - (y === T.other) || x.localeCompare(y));
  $("buildings").replaceChildren(el("button", !state.b ? "on" : "", T.all, () => { state.b = ""; }),
    ...blds.map(b => el("button", state.b === b ? "on" : "", esc(b), () => { state.b = state.b === b ? "" : b; })));
  const types = [...new Set(DATA.rooms.map(r => r.t).filter(t => t && T.types[t]))];
  $("types").replaceChildren(...types.map(t => el("button", "tag" + (state.t === t ? " on" : ""), T.types[t],
    () => { state.t = state.t === t ? "" : t; })));
  $("types").style.display = types.length ? "" : "none";
  if (!keepScroll) { center("days"); center("slots"); }

  if (!slots.length) {
    $("count").textContent = "∞"; $("count-of").textContent = ""; $("slotline").textContent = ""; $("bar").style.width = "0";
    $("list").innerHTML = `<div class="empty"><div>🎉</div>${T.nolessons}</div>`; return;
  }
  const [s, e] = slots.find(([a]) => a === state.slot);
  const S = mins(s), E = mins(e);
  const cur = isToday && S <= now.mins && now.mins < E;
  const q = state.q.trim().toLowerCase();
  const pool = DATA.rooms.filter(r => (!state.b || building(r.n) === state.b) && (!state.t || r.t === state.t));
  const free = [];
  for (const r of pool) {
    const busy = (r.b[state.day] || []).map(x => x.split("-").map(mins));
    if (busy.some(([a, b]) => a < E && b > S)) continue;
    const next = busy.filter(([a]) => a >= E).map(([a]) => a).sort((x, y) => x - y)[0];
    free.push({ ...r, next });
  }

  // hero
  $("count").textContent = free.length;
  $("count-of").textContent = T.freeOf(pool.length);
  $("live").className = "live" + (cur ? "" : " off");
  $("live-t").textContent = cur ? T.live : T.later;
  const when = isToday ? (cur ? T.ends(dur(E - now.mins)) : S > now.mins ? T.starts(dur(S - now.mins)) : "")
                       : $("days").querySelector(".on small").textContent;
  $("slotline").textContent = `${s} – ${e}${when ? " · " + when : ""}`;
  $("bar").style.width = (cur ? Math.round((now.mins - S) / (E - S) * 100) : 0) + "%";

  const shown = q ? free.filter(r => r.n.toLowerCase().includes(q)) : free;
  if (!shown.length) { $("list").innerHTML = `<div class="empty"><div>🔍</div>${T.none}</div>`; return; }
  const groups = {};
  for (const r of shown) (groups[building(r.n)] ||= []).push(r);
  const from = cur ? now.mins : S;
  $("list").innerHTML = Object.keys(groups).sort((x, y) => (x === T.other) - (y === T.other) || x.localeCompare(y)).map(b =>
    `<div class="group"><div class="group-h"><span class="dot" style="background:${BCOL[b] || "#64748b"}">${esc(b[0])}</span>${esc(b)} <small>${groups[b].length}</small></div><div class="grid">` +
    groups[b].map(r => {
      const left = r.next != null ? r.next - from : null;
      const cls = left == null ? "good" : left >= 90 ? "good" : left >= 40 ? "warn" : "bad";
      const badge = left == null ? T.rest : T.forT(hhmm(r.next));
      const meta = [r.c ? `<span>👥 ${T.seats(r.c)}</span>` : "", T.types[r.t] ? `<span>${T.types[r.t]}</span>` : ""].join("");
      return `<div class="room"><div class="room-name">${esc(r.n)}</div>` +
        (meta ? `<div class="room-meta">${meta}</div>` : "") + `<span class="badge ${cls}">${badge}</span></div>`;
    }).join("") + `</div></div>`).join("");
}

$("title").textContent = T.title; document.title = T.title;
$("l-day").textContent = T.day; $("l-time").textContent = T.time;
$("q").placeholder = T.search;
$("q").oninput = e => { state.q = e.target.value; render(true); };
fetch("rooms.json?v=" + Math.floor(Date.now() / 60000), { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    DATA = d;
    const f = d.fetched_at.replace("T", " ");
    $("foot").textContent = T.saved(`${f.slice(8, 10)}.${f.slice(5, 7)} ${f.slice(11, 16)}`);
    render();
    setInterval(() => render(true), 60000);
  })
  .catch(() => { $("list").innerHTML = `<div class="empty"><div>📡</div>${T.failed}</div>`; });
</script>
</body>
</html>
